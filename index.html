<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Sort Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=Baloo+Da+2:wght@500;700&family=Hind+Siliguri:wght@400;600&display=swap">
<style>
:root{--f-body:Nunito,"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;--f-head:Fredoka,"Baloo Da 2","Noto Sans Bengali",system-ui,sans-serif;--bg1:#16224a;--bg2:#070b16;--ink:#e8eefc;--muted:#8d9bbd;--line:rgba(255,255,255,.78);--s:42px;
  color-scheme:dark;box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;color:var(--ink);font-family:var(--f-body);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2) 70%),var(--bg2);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header,footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px}
header{justify-content:space-between}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:14px;
  padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px);transition:transform .12s,background .2s}
button:hover:not(:disabled){background:rgba(255,255,255,.16)}button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.35;cursor:default}
.lv{display:flex;align-items:center;gap:8px}
.lv .name{text-align:center;min-width:76px;line-height:1}.lv small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:3px}
.lv b{font-size:24px}
.stat{color:var(--muted);font-size:14px;min-width:70px;text-align:right}.stat b{color:var(--ink)}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
#board{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*.9) calc(var(--s)*.35);padding-top:calc(var(--s)*.6)}
#tip{color:var(--muted);font-size:13px;margin:14px 0 0;text-align:center}
.tube{position:relative;width:calc(var(--s)*1.25);height:calc(var(--s)*4 + 12px);border:2px solid var(--line);border-top-color:rgba(255,255,255,.35);
  border-radius:6px 6px calc(var(--s)*.62) calc(var(--s)*.62);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 45%,rgba(255,255,255,.09));
  box-shadow:inset 0 0 12px rgba(255,255,255,.08),0 10px 18px rgba(0,0,0,.35);
  transition:transform .45s cubic-bezier(.3,.7,.2,1),box-shadow .3s,border-color .3s}
.tube::after{content:"";position:absolute;left:14%;top:8px;bottom:22%;width:11%;border-radius:10px;pointer-events:none;z-index:3;
  background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.05))}
.tube.sel{transform:translateY(calc(var(--s)*-.5))}
.tube.done{border-color:#fff;box-shadow:0 0 20px rgba(120,220,255,.55),inset 0 0 12px rgba(255,255,255,.18)}
.liq{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse}
.seg{flex:none;height:var(--s);position:relative;
  background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,0) 38%,rgba(0,0,0,.24)),var(--c);box-shadow:inset 0 -1px rgba(0,0,0,.14)}
.surf{position:absolute;left:-10%;right:-10%;top:calc(var(--s)*-.15);height:calc(var(--s)*.3);border-radius:50%;background:var(--c);
  filter:brightness(1.3);animation:wave 3.2s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(6%) scaleY(.75)}}
.stream{position:absolute;z-index:25;border-radius:4px;pointer-events:none;box-shadow:inset -2px 0 rgba(0,0,0,.2),inset 2px 0 rgba(255,255,255,.35)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#win,#menu,#home,#settings,#tut,#backup,#splash{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,7,16,.6);backdrop-filter:blur(3px)}
#win.hide,#menu.hide,#home.hide,#settings.hide,#tut.hide,#backup.hide{display:none}
.card{background:linear-gradient(160deg,#1d2c5e,#0e1633);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:28px 34px;text-align:center;
  animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-size:26px}.card p{margin:0 0 18px;color:var(--muted)}
.primary{background:linear-gradient(135deg,#27a0ff,#b44cff);border:0;font-weight:600;padding:12px 26px}
footer{flex-wrap:wrap}footer button{padding:10px 12px;font-size:14px}.name{cursor:pointer}
.tube.hint{animation:hint .6s ease-in-out 3;border-color:#ffe66d}@keyframes hint{50%{box-shadow:0 0 24px #ffe66d}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,30,60,.96);border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:14px;z-index:70;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88%;text-align:center}#toast.show{opacity:1}
.card.menu{width:min(92vw,380px);text-align:left;padding:20px}.menu h3{margin:12px 0 4px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:34vh;overflow-y:auto;margin:8px 0}
.lvb{padding:8px 0;font-weight:600}.lvb small{display:block;font-size:9px;color:#ffd60a}.lvb.cur,.row button.cur{border-color:#ffd60a;background:rgba(255,214,10,.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
:root[data-skin="1"]{--bg1:#2b0f4f;--bg2:#08030f;--line:#7df9ff}
:root[data-skin="2"]{--bg1:#2c3a5c;--bg2:#10172b;--line:#ffd6e8}:root[data-skin="2"] .tube{border-radius:calc(var(--s)*.62)}
:root[data-skin="3"]{--bg1:#4a1d2c;--bg2:#12060a;--line:#ffd9a0}:root[data-skin="3"] .tube{border-radius:4px 4px 12px 12px}
:root[data-skin="4"]{--bg1:#1b1446;--bg2:#03030c;--line:#cfd8ff}
:root[data-skin="4"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(2px 2px at 44% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 40%,#fff,transparent),radial-gradient(1px 1px at 8% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 75%,#fff,transparent),radial-gradient(1px 1px at 30% 88%,#fff,transparent);animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.35}}
:root[data-skin="5"]{--line:#d6f6ff}
:root[data-skin="5"] body{background:radial-gradient(90% 45% at 50% 0%,rgba(125,224,255,.35),transparent),linear-gradient(180deg,#0d5c7a,#021a2b)}
:root[data-skin="5"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle 6px at 15% 100%,rgba(255,255,255,.28),transparent),radial-gradient(circle 4px at 40% 100%,rgba(255,255,255,.22),transparent),radial-gradient(circle 8px at 75% 100%,rgba(255,255,255,.25),transparent);animation:rise 9s linear infinite}@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
#splash{z-index:90;background:var(--bg2);text-align:center;animation:sp .5s 1.4s forwards}@keyframes sp{to{opacity:0;visibility:hidden}}
#splash h1{font-size:38px;margin:0 0 6px}#splash p,#home p{color:var(--muted);margin:0 0 16px}
#home{background:rgba(4,7,16,.92)}
:root[lang="bn"]{--f-body:"Hind Siliguri",Nunito,"Noto Sans Bengali",system-ui,sans-serif;--f-head:"Baloo Da 2",Fredoka,"Noto Sans Bengali",system-ui,sans-serif}
h1,h2,.lv b,.stat b,.lvb,.primary{font-family:var(--f-head)}#tut .card{max-width:340px}.col{display:flex;flex-direction:column;gap:10px;min-width:230px}
.cb .seg::before{content:attr(data-s);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.5);font-weight:700;color:rgba(0,0,0,.6);z-index:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="lv"><button id="prev" aria-label="Previous level">‹</button>
      <div class="name"><small id="lbl">LEVEL</small><b id="lv">1</b></div>
      <button id="next" aria-label="Next level">›</button></div>
    <div class="lv"><div class="stat"><span data-t="moves">Moves</span> <b id="mv">0</b></div><button id="menuBtn" aria-label="Menu">☰</button></div>
  </header>
  <main id="stage"><div id="board"></div><p id="tip" data-t="tip">Tap a tube, then tap another to pour.</p></main>
  <footer>
    <button id="undo" data-t="undo">↶ Undo</button><button id="hint" data-t="hint">💡 Hint</button><button id="addt" data-t="tube">＋ Tube</button><button id="restart" aria-label="Restart">⟲</button><button id="snd" aria-label="Sound">🔊</button>
  </footer>
</div>
<canvas id="fx"></canvas>
<div id="menu" class="hide"><div class="card menu"><h3 data-t="levels">LEVELS</h3><div id="grid" class="grid"></div><h3 data-t="dailyh">DAILY</h3><div class="row"><button id="daily"></button></div><h3 data-t="themes">THEMES</h3><div class="row" id="themes"></div><div class="row"><button id="mHome" data-t="home"></button><button id="mSet" data-t="settings"></button><button id="closeMenu" class="primary" data-t="close">Close</button></div></div></div>
<div id="home" class="hide"><div class="card"><h1 style="margin:0 0 4px">🧪 Water Sort</h1><p data-t="sub"></p><div class="col"><button id="hPlay" class="primary" data-t="play"></button><button id="hDaily" data-t="daily"></button><button id="hHow" data-t="how"></button><button id="hSet" data-t="settings"></button></div></div></div>
<div id="settings" class="hide"><div class="card"><h2 data-t="setT"></h2><div class="col"><button id="sSfx"></button><button id="sMusic"></button><button id="sTune"></button><button id="sHap"></button><button id="sCb"></button><button id="sLang"></button><button id="sBackup"></button><button id="sReset"></button><button id="sClose" class="primary" data-t="close"></button></div></div></div>
<div id="tut" class="hide"><div class="card"><h2 data-t="tutT"></h2><p data-t="tut" style="white-space:pre-line;text-align:left"></p><button id="tutOk" class="primary" data-t="ok"></button></div></div>
<div id="backup" class="hide"><div class="card menu"><h2 data-t="bkT"></h2><p data-t="bkP" style="font-size:13px"></p><textarea id="bkText" rows="4" style="width:100%;background:rgba(255,255,255,.07);color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px;font:12px monospace;resize:none"></textarea><div class="row"><button id="bkCopy" data-t="copy"></button><button id="bkRestore" data-t="restore"></button><button id="bkClose" class="primary" data-t="close"></button></div></div></div>
<div id="splash"><div><h1>🧪 Water Sort</h1><p data-t="sub"></p></div></div>
<div id="toast"></div>
<div id="win" class="hide"><div class="card"><h2 data-t="win">Level Complete!</h2><p id="winmsg"></p><button id="nextBtn" class="primary">Next Level</button></div></div>

<script>
const CAP=4,$=id=>document.getElementById(id),root=document.documentElement;
const COLORS=['#ff4d6d','#ff9f1c','#ffd60a','#4cd964','#00c2a8','#27a0ff','#5b5bff','#b44cff','#ff6bd6','#a1662f','#9aa6b2','#7be0ff'];
const board=$('board'),stage=$('stage');
const S={level:1,tubes:[],init:'',hist:[],moves:0,sel:-1,busy:false,won:false,s:42};
let save={unlocked:1,level:1,muted:false,stars:{},daily:{},theme:0,music:true,haptics:true,cb:false,lang:'en',seen:0,tune:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('wsp3')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('wsp3',JSON.stringify(save))}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tubeEl=i=>board.children[i];
const isDone=a=>a.length===CAP&&a.every(c=>c===a[0]);

/* ---------- Level generation (seeded + solver-verified) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canMove(t,f,to){if(f===to||!t[f].length||t[to].length>=CAP)return false;return !t[to].length||t[to][t[to].length-1]===t[f][t[f].length-1]}
function solvable(start,cap=25000){
  const path=[],seen=new Set();let nodes=0;const key=t=>t.map(x=>x.map(c=>c.toString(36)).join('')).sort().join('|');
  function dfs(t){
    if(t.every(x=>!x.length||isDone(x)))return true;
    const k=key(t);if(seen.has(k)||++nodes>cap)return false;seen.add(k);
    const mv=[];
    for(let f=0;f<t.length;f++)for(let o=0;o<t.length;o++){
      if(!canMove(t,f,o))continue;
      if(!t[o].length&&t[f].every(c=>c===t[f][0]))continue;
      mv.push([f,o,t[o].length?0:1]);
    }
    mv.sort((a,b)=>a[2]-b[2]);
    for(const[f,o]of mv){
      const n=t.map(x=>x.slice()),c=n[f][n[f].length-1];
      while(n[f].length&&n[f][n[f].length-1]===c&&n[o].length<CAP)n[o].push(n[f].pop());
      if(dfs(n)){path.push([f,o]);return true}
    }
    return false;
  }
  return dfs(start.map(x=>x.slice()))?path.reverse():null;
}
function genLevel(level,sb=level){
  const n=Math.min(10,3+Math.floor(level/1.6));let last;
  for(let a=0;a<60;a++){
    const r=rng(sb*7919+a*31),pool=[];
    for(let c=0;c<n;c++)for(let k=0;k<CAP;k++)pool.push(c);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const t=[];for(let i=0;i<n;i++)t.push(pool.slice(i*CAP,i*CAP+CAP));
    t.push([],[]);last=t;
    if(t.some(isDone))continue;
    if(solvable(t))return t;
  }
  return last;
}

/* ---------- Rendering ---------- */
function fit(){
  const W=stage.clientWidth-16,Hh=stage.clientHeight-50,n=S.tubes.length;let s=46;
  for(;s>=22;s-=2){const tw=s*1.25,g=s*.35,pm=Math.max(1,Math.floor((W+g)/(tw+g))),rows=Math.ceil(n/pm);
    if(rows*(4*s+12)+(rows-1)*s*.9+s*.6<=Hh)break}
  const tw=s*1.25,g=s*.35,pm=Math.max(1,Math.floor((W+g)/(tw+g))),rows=Math.ceil(n/pm),per=Math.ceil(n/rows);
  root.style.setProperty('--s',s+'px');S.s=s;board.style.width=(per*(tw+g)-g)+'px';
}
function draw(i){
  tubeEl(i).firstChild.innerHTML=S.tubes[i].map((c,k,a)=>`<div class="seg" data-s="${SYMS[c]}" style="--c:${COLORS[c]}">${k===a.length-1?'<i class="surf"></i>':''}</div>`).join('');
}
function syncDone(){S.tubes.forEach((t,i)=>tubeEl(i).classList.toggle('done',isDone(t)))}
function hud(){
  const dl=S.mode==='daily';$('lv').textContent=dl?'★':S.level;$('lbl').textContent=dl?T('dailyh'):T('level');$('mv').textContent=S.moves;$('addt').disabled=S.busy||S.won||S.tubes.length>S.base||S.tubes.length>=14;
  $('prev').disabled=dl||S.level<=1;$('next').disabled=dl||S.level>=save.unlocked;
  $('undo').disabled=!S.hist.length;$('snd').textContent=save.muted?'🔇':'🔊';
}
function build(){
  board.innerHTML='';
  S.tubes.forEach((_,i)=>{const d=document.createElement('div');d.className='tube';d.dataset.i=i;d.innerHTML='<div class="liq"></div>';board.appendChild(d)});
  fit();S.tubes.forEach((_,i)=>draw(i));syncDone();hud();
}
function loadLevel(n,reuse,daily){S.mode=daily?'daily':'level';
  if(!daily){S.level=n;save.level=n;persist()}
  S.tubes=reuse?JSON.parse(S.init):daily?genLevel(8+dayNum()%5,dayNum()):genLevel(n);S.init=JSON.stringify(S.tubes);S.base=S.tubes.length;S.par=lowerBound(S.tubes);
  S.hist=[];S.moves=0;S.sel=-1;S.won=false;S.busy=false;$('win').classList.add('hide');build();
}

/* ---------- Gameplay ---------- */
function clearSel(){if(S.sel>=0)tubeEl(S.sel)?.classList.remove('sel');S.sel=-1}
function select(i){clearSel();S.sel=i;tubeEl(i).classList.add('sel');sfx.pop()}
board.addEventListener('click',e=>{
  const el=e.target.closest('.tube');if(!el||S.busy||S.won)return;const i=+el.dataset.i;
  if(S.sel<0){S.tubes[i].length?select(i):sfx.bad();return}
  if(i===S.sel){clearSel();sfx.pop();return}
  if(canMove(S.tubes,S.sel,i))pour(S.sel,i);
  else if(S.tubes[i].length)select(i);
  else{clearSel();sfx.bad()}
});
async function pour(f,t){
  S.busy=true;clearSel();
  const A=tubeEl(f),B=tubeEl(t),src=S.tubes[f],dst=S.tubes[t],col=src[src.length-1],s=S.s;
  let run=0;for(let k=src.length-1;k>=0&&src[k]===col;k--)run++;
  const cnt=Math.min(run,CAP-dst.length);
  S.hist.push(JSON.stringify(S.tubes));
  const W=A.offsetWidth,H=A.offsetHeight,dir=B.offsetLeft>=A.offsetLeft?1:-1,ang=58*Math.PI/180;
  const lx=dir*(W/2*Math.cos(ang)+H/2*Math.sin(ang)),ly=W/2*Math.sin(ang)-H/2*Math.cos(ang);
  const lipX=B.offsetLeft+W/2-dir*W*.12,lipY=B.offsetTop-s*.1;
  const dx=lipX-lx-(A.offsetLeft+W/2),dy=lipY-ly-(A.offsetTop+H/2);
  A.style.zIndex=30;A.style.transform=`translate(${dx}px,${dy}px) rotate(${dir*58}deg)`;sfx.lift();
  await sleep(470);
  const st=document.createElement('div');st.className='stream';st.style.background=COLORS[col];
  st.style.left=(lipX-s*.07)+'px';st.style.width=(s*.14)+'px';board.appendChild(st);
  const kids=[...A.firstChild.children].slice(-cnt).reverse();
  B.querySelector('.surf')?.remove();
  const tmp=document.createElement('div');tmp.className='seg';tmp.dataset.s=SYMS[col];tmp.style.setProperty('--c',COLORS[col]);tmp.style.height='0px';
  tmp.innerHTML='<i class="surf"></i>';B.firstChild.appendChild(tmp);
  const dur=420+cnt*280,t0=performance.now();sfx.pour(dur/1000);
  await new Promise(res=>{(function fr(now){
    const p=Math.min(1,(now-t0)/dur),M=cnt*(1-p);
    kids.forEach((k,j)=>k.style.height=Math.max(0,Math.min(1,M-j))*s+'px');
    tmp.style.height=cnt*p*s+'px';
    const surf=B.offsetTop+H-2-(dst.length+cnt*p)*s;
    st.style.top=lipY+'px';st.style.height=Math.max(0,surf-lipY)+'px';st.style.opacity=p>.9?(1-p)/.1:1;
    p<1?requestAnimationFrame(fr):res();
  })(t0)});
  st.remove();
  for(let k=0;k<cnt;k++)dst.push(src.pop());
  S.moves++;A.style.transform='';draw(f);draw(t);hud();
  await sleep(450);A.style.zIndex='';
  if(isDone(dst)){B.classList.add('done');burst(B,col);sfx.done()}
  S.busy=false;
  hud();checkEnd();
}
function win(){
  S.won=true;const st=stars(),dk=dayNum();$('nextBtn').textContent=S.mode==='daily'?T('back'):T('next');if(S.mode==='daily')save.daily[dk]=Math.max(save.daily[dk]||0,st);else{save.unlocked=Math.max(save.unlocked,S.level+1);save.stars[S.level]=Math.max(save.stars[S.level]||0,st)}persist();hud();
  confetti();sfx.win();
  setTimeout(()=>{$('winmsg').textContent='★'.repeat(st)+'☆'.repeat(3-st)+` · ${S.moves} `+T('moves');$('win').classList.remove('hide')},900);
}
$('undo').onclick=()=>{
  if(S.busy||S.won||!S.hist.length)return;
  S.tubes=JSON.parse(S.hist.pop());S.moves=Math.max(0,S.moves-1);clearSel();
  if(board.children.length!==S.tubes.length)build();else{S.tubes.forEach((_,i)=>draw(i));syncDone()}hud();sfx.pop();
};
$('restart').onclick=()=>{if(!S.busy){loadLevel(S.level,true,S.mode==='daily');sfx.pop()}};
$('prev').onclick=()=>{if(!S.busy&&S.level>1)loadLevel(S.level-1)};
$('next').onclick=()=>{if(!S.busy&&S.level<save.unlocked)loadLevel(S.level+1)};
$('nextBtn').onclick=()=>loadLevel(S.mode==='daily'?save.level:S.level+1);

/* ---------- Audio (Web Audio synth) ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,f2=null,delay=0){
  const c=ac();if(!c||save.muted)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,f0,f1,v){
  const c=ac();if(!c||save.muted)return;const n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=3;
  fl.frequency.setValueAtTime(f0,c.currentTime);fl.frequency.linearRampToValueAtTime(f1,c.currentTime+d);
  const g=c.createGain();g.gain.setValueAtTime(v,c.currentTime);g.gain.linearRampToValueAtTime(0,c.currentTime+d);
  s.connect(fl).connect(g).connect(c.destination);s.start();
}
const sfx={
  pop:()=>tone(600,.1,'sine',.15,900),lift:()=>tone(300,.15,'triangle',.1,520),
  pour:d=>{vib(25);const r=Math.random(),a=450+r*250;noise(d,a,a+400+r*500,.2);tone(300+r*160,d,'sine',.04,500+r*250);for(let i=0;i<3;i++)tone(500+Math.random()*500,.08,'sine',.05,null,i*d/3)},bad:()=>tone(180,.15,'square',.05,120),
  done:()=>vib([30,40,30])||[784,988,1175].forEach((f,i)=>tone(f,.4,'sine',.12,null,i*.09)),
  win:()=>vib([40,60,40,60,90])||[523,659,784,1047,1319].forEach((f,i)=>tone(f,.55,'triangle',.13,null,i*.12))
};

function vib(p){if(!save.haptics)return;const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H){try{H.vibrate({duration:Array.isArray(p)?p.reduce((a,b)=>a+b,0):p})}catch(e){}return}if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

  clearInterval(mT);mT=0;if(!save.music)return;const c=ac();if(!c)return;const TU=[{s:[261.6,293.7,329.6,392,440,523.3,659.3],k:3,w:'sine'},{s:[220,261.6,293.7,329.6,392,440,523.3],k:4,w:'triangle'},{s:[392,440,523.3,587.3,659.3,784,880],k:2,w:'sine'}];let tick=0;

/* ---------- Particles ---------- */
const fx=$('fx'),cx=fx.getContext('2d');let P=[],raf=0,DPR=1;
function sizeFx(){DPR=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*DPR;fx.height=innerHeight*DPR}
function loopFx(){
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.l>0);
  for(const p of P){
    p.l--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;cx.globalAlpha=Math.min(1,p.l/20);cx.fillStyle=p.c;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.t)cx.fillRect(-p.s,-p.s/2,p.s*2,p.s);else{cx.fillRect(-p.s,-p.s/5,p.s*2,p.s*.4);cx.fillRect(-p.s/5,-p.s,p.s*.4,p.s*2)}
    cx.restore();
  }
  cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loopFx):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(el,col){
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top;
  for(let i=0;i<34;i++){const a=rnd(0,Math.PI*2),v=rnd(1,4);
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.1,l:rnd(45,80),s:rnd(3,7),r:rnd(0,3),vr:rnd(-.1,.1),t:0,
      c:[COLORS[col],'#fff','#ffe66d'][i%3]})}
  if(!raf)raf=requestAnimationFrame(loopFx);
}
function confetti(){
  for(let i=0;i<200;i++)P.push({x:rnd(0,innerWidth),y:rnd(-40,-5),vx:rnd(-1.5,1.5),vy:rnd(2,5),g:.04,l:rnd(160,260),s:rnd(3,6),
    r:rnd(0,6),vr:rnd(-.2,.2),t:1,c:COLORS[i%COLORS.length]});
  if(!raf)raf=requestAnimationFrame(loopFx);
}
